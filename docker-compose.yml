version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticket-triage-backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./ticket_triage.db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket-triage-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
